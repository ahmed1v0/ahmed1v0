name: Profile metrics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/profile-metrics.yml"
      - "scripts/generate_codeforces_graph.py"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate Codeforces rating graph
        run: |
          mkdir -p dist
          python scripts/generate_codeforces_graph.py \
            --handle Ahmed1v0 \
            --output dist/codeforces-rating.svg

      - name: Generate animated 3D contribution calendar
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ahmed1v0

      - name: Copy animated 3D contribution asset
        run: |
          cp profile-3d-contrib/profile-season-animate.svg dist/github-3d-contrib-animate.svg

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: ahmed1v0
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%237c3aed&color_dots=%23e6e8ef,%23a78bfa,%2360a5fa,%2322d3ee,%230891b2
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23a78bfa&color_dots=%23161922,%237c3aed,%2360a5fa,%2322d3ee,%230891b2

      - name: Publish generated assets
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
